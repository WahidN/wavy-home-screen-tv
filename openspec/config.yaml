schema: spec-driven

context: |
  Bare: a minimal, fast home screen (launcher) for Android TV.
  Target device: TCL TV, Android 11 (API 30), D-pad remote only.
  Tech: Kotlin, Jetpack Compose for TV (androidx.tv:tv-material), DataStore, Gradle Kotlin DSL.
  Goals: fast, offline, no permissions, no background work, no network.
  Owner is a web/React Native dev learning Android; keep code simple.
  Docs: short, plain language, no em dashes.

